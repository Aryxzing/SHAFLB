[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.light]
primaryColor = "#0f766e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f8"
textColor = "#0f172a"
borderColor = "#e2e8f0"
linkColor = "#0f766e"

[theme.dark]
primaryColor = "#2dd4bf"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131c2e"
textColor = "#e2e8f0"
borderColor = "#23304a"
linkColor = "#5eead4"

[browser]
gatherUsageStats = false

[server]
headless = true
port = 8501

[client]
toolbarMode = "minimal"
